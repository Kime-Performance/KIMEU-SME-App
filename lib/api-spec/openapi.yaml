openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: kimeu
    description: KIMEU workshop operations backed by Google Sheets
paths:
  /kimeu/foundations-assessment:
    get:
      operationId: getKimeuFoundationsAssessment
      responses:
        "200":
          description: RD assessment roster and current sheet results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoundationsAssessmentWorkspace" }
    post:
      operationId: saveKimeuFoundationsAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FoundationsAssessmentInput" }
      responses:
        "200":
          description: Assessment result verified in Exam Result column H
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoundationsAssessmentWorkspace" }
  /kimeu/fellowship-reviews:
    get:
      operationId: getKimeuFellowshipReviews
      responses:
        "200":
          description: Fellowship review workspace for approved reviewers and administrators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FellowshipReviewWorkspace" }
    post:
      operationId: saveKimeuFellowshipReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FellowshipReviewInput" }
      responses:
        "200":
          description: Review and audit saved atomically and verified by readback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FellowshipReviewWorkspace" }
  /kimeu/admin/sme-assignments:
    get:
      operationId: getKimeuSmeAssignments
      responses:
        "200":
          description: Existing approved staff and workshop assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmeAssignments" }
    post:
      operationId: saveKimeuSmeAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmeAssignmentInput" }
      responses:
        "200":
          description: Saved assignments confirmed by sheet readback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmeAssignments" }
  /kimeu/onboarding/{courseId}:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string, enum: [F-11, F-12, EN-CAD, F-SURG-OBS] } }
    get:
      operationId: getKimeuOnboarding
      responses:
        "200":
          description: RD onboarding workspace, with sheet-calculated progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingWorkspace" }
    post:
      operationId: saveKimeuOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingInput" }
      responses:
        "200":
          description: RD inputs saved and confirmed by sheet readback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingWorkspace" }
  /kimeu/courses/{workshopId}/tracking/{sessionDate}:
    get:
      operationId: getKimeuCourseTracking
      parameters:
        - { name: workshopId, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: sessionDate, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: Live PT directory with attendance and read-only sheet status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseTracking" }
  /kimeu/courses/{workshopId}/tracking:
    post:
      operationId: saveKimeuCourseTracking
      parameters:
        - { name: workshopId, in: path, required: true, schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseTrackingInput" }
      responses:
        "200":
          description: Saved tracking reread from Sheets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseTracking" }
  /kimeu/courses/{workshopId}/practicals:
    get:
      operationId: getKimeuPracticals
      tags: [Kimeu]
      parameters:
        - name: workshopId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Assigned post-workshop practical records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticalWorkspace" }
    post:
      operationId: saveKimeuPractical
      tags: [Kimeu]
      parameters:
        - name: workshopId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticalSignoff" }
      responses:
        "200":
          description: Saved and reread from the test spreadsheet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticalWorkspace" }
  /kimeu/courses/{workshopId}/practical-schedule:
    post:
      operationId: saveKimeuPracticalSchedule
      tags: [Kimeu]
      parameters:
        - name: workshopId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticalScheduleInput" }
      responses:
        "200":
          description: Practical schedule saved without changing completion evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticalWorkspace" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /kimeu/bootstrap:
    get:
      operationId: getKimeuBootstrap
      tags: [kimeu]
      summary: Resolve current access and setup readiness
      responses:
        "200":
          description: Current user's KIMEU access and sheet readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "401":
          description: Sign-in required
  /kimeu/courses:
    get:
      operationId: getKimeuCourses
      tags: [kimeu]
      summary: List workshop catalog courses permitted for the signed-in SME
      responses:
        "200":
          description: Authorized course frames sourced from the workshop catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseCatalog"
        "401":
          description: Sign-in required
        "403":
          description: Active app access required
  /kimeu/upcoming:
    get:
      operationId: getKimeuUpcoming
      tags: [kimeu]
      summary: Read workshop occurrences from KIMEU Calendar; never imports attendance
      responses:
        "200":
          description: Read-only workshop schedule for the next twelve months
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingSchedule"
        "401":
          description: Sign-in required
        "503":
          description: Calendar or workshop catalog unavailable
  /kimeu/today:
    get:
      operationId: getKimeuToday
      tags: [kimeu]
      summary: List today's sessions and outstanding attendance work
      responses:
        "200":
          description: Sessions and due work for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayResponse"
  /kimeu/sessions:
    post:
      operationId: openKimeuSession
      tags: [kimeu]
      summary: Open a session and ensure its session-log row exists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSessionInput"
      responses:
        "200":
          description: Session and roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "400":
          description: Invalid request or required sheet header missing
        "403":
          description: User does not have access to this workshop
        "503":
          description: Test spreadsheet or service account is not configured
  /kimeu/sessions/{sessionId}:
    get:
      operationId: getKimeuSession
      tags: [kimeu]
      summary: Get a session and its roster
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session and roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "404":
          description: Session not found
  /kimeu/sessions/{sessionId}/attendance:
    post:
      operationId: saveKimeuAttendance
      tags: [kimeu]
      summary: Save attendance marks for one or more clinicians
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceBatchInput"
      responses:
        "200":
          description: Saved attendance and sheet-computed statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceBatchResponse"
        "400":
          description: Invalid request or required sheet header missing
        "403":
          description: User does not have permission
        "503":
          description: Test spreadsheet or service account is not configured
  /kimeu/sessions/{sessionId}/complete:
    post:
      operationId: completeKimeuSession
      tags: [kimeu]
      summary: Complete a session and append its closing notes
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSessionInput"
      responses:
        "200":
          description: Session completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "409":
          description: Attendance still needs confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnmarkedAttendance"
        "503":
          description: Test spreadsheet or service account is not configured
  /kimeu/clinician-notes:
    post:
      operationId: appendKimeuClinicianNote
      tags: [kimeu]
      summary: Append a clinician note without editing prior notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicianNoteInput"
      responses:
        "201":
          description: Appended note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicianNoteResponse"
        "400":
          description: Invalid request or required sheet header missing
        "403":
          description: User does not have permission
        "503":
          description: Test spreadsheet or service account is not configured
components:
  schemas:
    FoundationsAssessmentInput:
      type: object
      required: [email, result, revision]
      properties:
        email: { type: string, format: email }
        result: { type: string, enum: [Pass, Fail] }
        revision: { type: string, minLength: 1 }
    FoundationsAssessmentWorkspace:
      type: object
      required: [people]
      properties:
        people:
          type: array
          items: { $ref: "#/components/schemas/FoundationsAssessmentPerson" }
    FoundationsAssessmentPerson:
      type: object
      required: [email, name, location, result, revision]
      properties:
        email: { type: string }
        name: { type: string }
        location: { type: string }
        result: { type: string }
        revision: { type: string }
    FellowshipReviewInput:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        reviewDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        result: { type: string, enum: [Pass, Refocus] }
        score: { type: number, minimum: 0, maximum: 100 }
        notes: { type: string, maxLength: 4000 }
        workshopId: { type: [string, "null"] }
        revision: { type: string, minLength: 1 }
        requestId: { type: string, format: uuid }
      required: [email, reviewDate, result, score, notes, workshopId, revision, requestId]
    FellowshipReviewEntry:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        reviewDate: { type: string }
        reviewedBy: { type: string }
        reviewType: { type: string }
        result: { type: string }
        score: { type: [number, "null"] }
        notes: { type: string }
        specificNeed: { type: string }
        workshopId: { type: [string, "null"] }
        status: { type: string }
        updatedAt: { type: string }
      required: [id, email, name, reviewDate, reviewedBy, reviewType, result, score, notes, specificNeed, workshopId, status, updatedAt]
    FellowshipReviewPerson:
      type: object
      properties:
        email: { type: string }
        name: { type: string }
        location: { type: string }
        revision: { type: string }
      required: [email, name, location, revision]
    FellowshipRefocusWorkshop:
      type: object
      properties:
        workshopId: { type: string }
        name: { type: string }
      required: [workshopId, name]
    FellowshipReviewWorkspace:
      type: object
      properties:
        today: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        people:
          type: array
          items: { $ref: "#/components/schemas/FellowshipReviewPerson" }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/FellowshipReviewEntry" }
        workshops:
          type: array
          items: { $ref: "#/components/schemas/FellowshipRefocusWorkshop" }
      required: [today, people, reviews, workshops]
    SmeAssignmentInput:
      type: object
      required: [email, revision, smeRoles, workshopIds]
      properties:
        email: { type: string, minLength: 1 }
        revision: { type: string, minLength: 1 }
        smeRoles:
          type: array
          maxItems: 2
          items: { type: string, enum: [SME Assist, SME Lead] }
        workshopIds:
          type: array
          items: { type: string }
    SmeAssignments:
      type: object
      required: [revision, staff, courses]
      properties:
        revision: { type: string }
        staff:
          type: array
          items: { $ref: "#/components/schemas/SmeAssignmentStaff" }
        courses:
          type: array
          items: { $ref: "#/components/schemas/CourseSummary" }
    SmeAssignmentStaff:
      type: object
      required: [email, name, active, roles, workshopIds]
      properties:
        email: { type: string }
        name: { type: string }
        active: { type: boolean }
        roles: { type: array, items: { type: string } }
        workshopIds: { type: array, items: { type: string } }
    OnboardingInput:
      type: object
      required: [email, revision, week, date, attended, result, notes]
      properties:
        email: { type: string, minLength: 1 }
        revision: { type: string, minLength: 1 }
        week: { type: integer, minimum: 1, maximum: 4 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        attended: { type: boolean }
        result: { type: string, enum: ["", Pass, Fail] }
        notes: { type: string, maxLength: 4000 }
    OnboardingWorkspace:
      type: object
      required: [courseId, requiredWeeks, canSignOff, people]
      properties:
        courseId: { type: string }
        requiredWeeks: { type: integer }
        canSignOff: { type: boolean }
        people:
          type: array
          items: { $ref: "#/components/schemas/OnboardingPerson" }
    OnboardingPerson:
      type: object
      required: [email, name, location, revision, completedWeeks, sheetStatus, units]
      properties:
        email: { type: string }
        name: { type: string }
        location: { type: string }
        revision: { type: string }
        completedWeeks: { type: integer }
        sheetStatus: { type: string }
        units:
          type: array
          items: { $ref: "#/components/schemas/OnboardingUnit" }
    OnboardingUnit:
      type: object
      required: [week, date, attended, result, notes, signedBy, signedAt]
      properties:
        week: { type: integer }
        date: { type: string }
        attended: { type: boolean }
        result: { type: string }
        notes: { type: string }
        signedBy: { type: string }
        signedAt: { type: string }
    CourseTrackingInput:
      type: object
      required: [sessionDate, revision, kind, marks]
      properties:
        sessionDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        revision: { type: string, minLength: 1 }
        kind: { type: string, enum: [attendance] }
        marks:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/TrackingMark" }
    TrackingMark:
      type: object
      required: [email, checked]
      properties:
        email: { type: string, minLength: 1 }
        checked: { type: boolean }
    CourseTracking:
      type: object
      required: [sessionDate, revision, canSaveAttendance, rosterRefreshedAt, people]
      properties:
        sessionDate: { type: string }
        revision: { type: string }
        canSaveAttendance: { type: boolean }
        rosterRefreshedAt: { type: string }
        people:
          type: array
          items: { $ref: "#/components/schemas/CourseTrackingPerson" }
    CourseTrackingPerson:
      type: object
      required: [email, name, location, attended, practicalPassed, preCourseComplete, sheetStatus]
      properties:
        email: { type: string }
        name: { type: string }
        location: { type: string }
        attended: { type: boolean }
        practicalPassed: { type: boolean }
        preCourseComplete: { type: boolean }
        sheetStatus: { type: string }
    PracticalScheduleInput:
      type: object
      required: [recordKey, revision, scheduledDate]
      properties:
        recordKey: { type: string, minLength: 1 }
        revision: { type: string, minLength: 1 }
        scheduledDate: { type: ["string", "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
    PracticalSignoff:
      type: object
      required: [recordKey, revision, result, practicalDate, notes]
      properties:
        recordKey: { type: string, minLength: 1 }
        revision: { type: string, minLength: 1 }
        result: { type: string, enum: [Pass, Fail] }
        practicalDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        notes: { type: string, maxLength: 4000 }
        kStarPerformed: { type: boolean }
        kStarStars: { type: ["integer", "null"], minimum: 0, maximum: 4 }
    PracticalWorkspace:
      type: object
      required: [canSignOff, records]
      properties:
        canSignOff: { type: boolean }
        records:
          type: array
          items: { $ref: "#/components/schemas/PracticalRecord" }
    PracticalRecord:
      type: object
      required: [recordKey, revision, clinicianEmail, name, rd, sessionDate, attended, result, practicalDate, scoredBy, eligible, history]
      properties:
        recordKey: { type: string }
        revision: { type: string }
        clinicianEmail: { type: string }
        name: { type: string }
        rd: { type: string }
        sessionDate: { type: string }
        attended: { type: boolean }
        result: { type: string }
        practicalDate: { type: string }
        scheduledDate: { type: ["string", "null"] }
        scoredBy: { type: string }
        eligible: { type: boolean }
        kStarPerformed: { type: ["boolean", "null"] }
        kStarStars: { type: ["integer", "null"], minimum: 0, maximum: 4 }
        kStarHighestEarned: { type: ["integer", "null"], minimum: 1, maximum: 4 }
        history:
          type: array
          items: { $ref: "#/components/schemas/PracticalHistory" }
    PracticalHistory:
      type: object
      required: [id, created, author, note]
      properties:
        id: { type: string }
        created: { type: string }
        author: { type: string }
        note: { type: string }
    CourseCatalog:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/CourseSummary"
    CourseSummary:
      type: object
      required: [workshopId, name, stage, topic, leadSme]
      properties:
        workshopId: { type: string }
        name: { type: string }
        stage: { type: string }
        topic: { type: ["string", "null"] }
        leadSme: { type: ["string", "null"] }
    UpcomingSchedule:
      type: object
      required: [calendarName, refreshedAt, throughDate, occurrences]
      properties:
        calendarName: { type: string }
        refreshedAt: { type: string }
        throughDate: { type: string }
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/WorkshopOccurrence"
    WorkshopOccurrence:
      type: object
      required: [occurrenceId, title, start, end, allDay, location, status, calendarUrl, workshopId, stage]
      properties:
        occurrenceId: { type: string }
        title: { type: string }
        start: { type: string }
        end: { type: string }
        allDay: { type: boolean }
        location: { type: ["string", "null"] }
        status:
          type: string
          enum: [confirmed, tentative, cancelled]
        calendarUrl: { type: ["string", "null"] }
        workshopId: { type: ["string", "null"] }
        stage: { type: ["string", "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required: [error]
    SetupReadiness:
      type: object
      properties:
        trackingMode:
          type: string
          enum: [live, test, unconfigured]
        configured:
          type: boolean
        sheetId:
          type: [string, "null"]
        notePrivacyReady:
          type: boolean
        writeEnabled:
          type: boolean
        missing:
          type: array
          items:
            type: string
      required: [configured, trackingMode, sheetId, notePrivacyReady, writeEnabled, missing]
    AppUser:
      type: object
      properties:
        email:
          type: string
        nameInSheets:
          type: string
        roles:
          type: array
          items:
            type: string
        workshopIds:
          type: array
          items:
            type: string
        active:
          type: boolean
      required: [email, nameInSheets, roles, workshopIds, active]
    BootstrapResponse:
      type: object
      properties:
        readiness:
          $ref: "#/components/schemas/SetupReadiness"
        user:
          oneOf:
            - $ref: "#/components/schemas/AppUser"
            - type: "null"
        access:
          type: string
          enum: [allowed, domain_denied, inactive, role_denied, not_configured]
      required: [readiness, user, access]
    SessionSummary:
      type: object
      properties:
        sessionId:
          type: string
        workshopId:
          type: string
        workshopName:
          type: string
        stage:
          type: [string, "null"]
        sessionDate:
          type: string
          format: date
        startTime:
          type: [string, "null"]
        location:
          type: [string, "null"]
        leadSme:
          type: [string, "null"]
        sessionStatus:
          type: string
          enum: [Scheduled, Live, Complete, Cancelled]
        rosterCount:
          type: integer
        presentCount:
          type: integer
        absentCount:
          type: integer
        unmarkedCount:
          type: integer
      required:
        - sessionId
        - workshopId
        - workshopName
        - stage
        - sessionDate
        - startTime
        - location
        - leadSme
        - sessionStatus
        - rosterCount
        - presentCount
        - absentCount
        - unmarkedCount
    TodayResponse:
      type: object
      properties:
        date:
          type: string
          format: date
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        dueCount:
          type: integer
      required: [date, sessions, dueCount]
    OpenSessionInput:
      type: object
      properties:
        workshopId:
          type: string
          minLength: 1
        sessionDate:
          type: string
          format: date
      required: [workshopId, sessionDate]
    RosterPerson:
      type: object
      properties:
        clinicianEmail:
          type: string
        name:
          type: string
        attended:
          type: [string, "null"]
          enum: [Yes, No, null]
        sourceTab:
          type: string
          enum: ["03b-Advanced Workshop Log", "03c-Foundations Tracker"]
        computedStatus:
          type: [string, "null"]
        practicalStatus:
          type: [string, "null"]
      required: [clinicianEmail, name, attended, sourceTab, computedStatus, practicalStatus]
    SessionDetail:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/SessionSummary"
        roster:
          type: array
          items:
            $ref: "#/components/schemas/RosterPerson"
        sessionNotes:
